name: One-shot format frontier training contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/format-frontier.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'frontier/training-contract-v2' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frontier/training-contract-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Format and verify without semantic rewrites
        run: |
          set -euo pipefail
          python -m pip install 'PyNaCl==1.6.2' 'jsonschema==4.26.0' 'ruff==0.15.22'
          ruff format laptop tests
          ruff check --fix laptop tests
          ruff check laptop tests
          python -m py_compile laptop/*.py tests/*.py
          python -m unittest discover -s tests -v
          node --check cloud/sign-job.mjs
          node --check cloud/verify-receipt.mjs
          node --check cloud/materialize-frontier-spec.mjs
          node --test tests/test_cloud_contract.mjs tests/test_materialize_frontier_spec.mjs

      - name: Commit formatting only
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laptop tests
          git commit -m 'style(frontier): apply deterministic Ruff formatting' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:frontier/training-contract-v2
