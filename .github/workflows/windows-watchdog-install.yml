name: Windows GPU bridge watchdog install

on:
  # Never run an action-bearing watchdog installer automatically on push/merge.
  workflow_dispatch:
    inputs:
      authorize_install:
        description: "Explicit one-run owner-authorized installation, default denied"
        required: true
        type: boolean
        default: false
      reviewed_source_sha:
        description: "Exact 40-character protected-main commit reviewed for this run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-gpu-bridge-watchdog-install
  cancel-in-progress: false

jobs:
  install-and-prove:
    # These explicit GitHub controls are defense-in-depth, NOT owner attestation.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorize_install == true && vars.SZL_WATCHDOG_INSTALL_ENABLED == 'true' && github.actor == vars.SZL_WATCHDOG_INSTALL_OPERATOR }}
    name: Install, reconcile, and prove bounded liveness
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Require immutable reviewed main and intended owner runner
        shell: powershell
        env:
          SZL_REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
          SZL_APPROVED_RUNNER_NAME: ${{ vars.SZL_WATCHDOG_APPROVED_RUNNER_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'WATCHDOG_NOT_PROTECTED_MAIN' }
          if ($env:SZL_REVIEWED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind execution to an existing SZL bridge owner node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The runner service identity must be elevated.'
          }
          $task = Get-ScheduledTask -TaskName 'SZL-GPU-Bridge' -ErrorAction SilentlyContinue
          $daemon = Test-Path -LiteralPath 'C:\szl-bridge\daemon.ps1' -PathType Leaf
          if ($null -eq $task -or -not $daemon) {
            throw 'Existing owner prerequisites unavailable: both primary task and installed daemon are required.'
          }
          # Presence is not authorization: inspect one exact task action, before install.
          function Test-ReviewedPrimaryTaskAction {
            param($Task)
            if ($null -eq $Task -or @($Task).Count -ne 1) { return $false }
            if ($null -eq $Task.Actions -or @($Task.Actions).Count -ne 1) { return $false }
            if ([string]$Task.TaskPath -cne '\') { return $false }
            if ($null -eq $Task.Principal) { return $false }
            $account = [string]$Task.Principal.UserId
            if ([string]::IsNullOrWhiteSpace($account)) { return $false }
            if ($account -match '^(SYSTEM|NT AUTHORITY\\(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)|LOCAL SERVICE|NETWORK SERVICE)$') { return $false }
            if ([string]$Task.Principal.LogonType -notin @('Interactive','S4U')) { return $false }
            if ([string]::IsNullOrWhiteSpace([string]$env:SystemRoot)) { return $false }
            $expectedExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            $expectedArgs = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "C:\szl-bridge\daemon.ps1"'
            $action = @($Task.Actions)[0]
            if (-not [string]::Equals([string]$action.Execute, $expectedExe, [StringComparison]::OrdinalIgnoreCase)) { return $false }
            if (-not [string]::Equals([string]$action.Arguments, $expectedArgs, [StringComparison]::OrdinalIgnoreCase)) { return $false }
            if (-not [string]::IsNullOrWhiteSpace([string]$action.WorkingDirectory)) { return $false }
            return $true
          }
          if (-not (Test-ReviewedPrimaryTaskAction -Task $task)) {
            throw 'Existing primary task action is unverified or differs from reviewed installer.'
          }
          if ("$(git rev-parse HEAD)" -ne $env:GITHUB_SHA) {
            throw 'Checkout does not own the exact event revision.'
          }

      - name: Refuse stale owner daemon or absent storage preflight before mutations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The watchdog installer intentionally retains an existing daemon.
          # A stale installed daemon or missing preflight makes a green
          # three-task proof misleading. Refuse before installing any task.
          foreach ($relative in @('daemon.ps1','storage_preflight.py')) {
            $installed = Join-Path 'C:\szl-bridge' $relative
            $expected = Join-Path $env:GITHUB_WORKSPACE ('laptop\' + $relative)
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
              throw "Missing reviewed owner prerequisite: $relative"
            }
            if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) {
              throw "Missing protected source prerequisite: $relative"
            }
            $parity = & "$env:GITHUB_WORKSPACE\laptop\source_parity.ps1" `
              -ExpectedSource $expected -InstalledSource $installed
            if ($parity -cne 'SOURCE_PARITY_VERIFIED') {
              throw "Installed owner source parity mismatch: $relative"
            }
          }

      - name: Install the exact local watchdog package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & .\laptop\install_watchdog.ps1 `
            -Root 'C:\szl-bridge' `
            -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'laptop') 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Watchdog installer failed with exit code $LASTEXITCODE."
          }
          # The installer output contains the local task principal. It is intentionally
          # held in memory only and is never printed or uploaded.
          if ([string]::IsNullOrWhiteSpace($output)) {
            throw 'Watchdog installer did not produce its local receipt.'
          }

      - name: Run one bounded reconciliation cycle
        id: reconcile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & 'C:\szl-bridge\watchdog.ps1' `
            -Mode Watchdog `
            -Root 'C:\szl-bridge' 2>&1 | Out-String
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($output)) {
            throw 'Watchdog did not produce a local cycle receipt.'
          }
          exit 0

      - name: Materialize a sanitized owner-node proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'reports'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null

          $taskNames = @(
            'SZL-GPU-Bridge',
            'SZL-GPU-Bridge-Watchdog',
            'SZL-GPU-Bridge-Guardian'
          )
          $tasks = @(
            foreach ($name in $taskNames) {
              $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
              $info = Get-ScheduledTaskInfo -TaskName $name
              [ordered]@{
                name = $name
                state = [string]$task.State
                last_task_result = [int64]$info.LastTaskResult
                last_run_time = if ($info.LastRunTime.Year -ge 2000) {
                  $info.LastRunTime.ToUniversalTime().ToString('o')
                } else { $null }
                next_run_time = if ($info.NextRunTime.Year -ge 2000) {
                  $info.NextRunTime.ToUniversalTime().ToString('o')
                } else { $null }
              }
            }
          )

          $files = @(
            foreach ($relative in @('daemon.ps1','watchdog.ps1','watchdog-config.json','storage_preflight.py')) {
              $path = Join-Path 'C:\szl-bridge' $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Required installed file is missing: $relative"
              }
              [ordered]@{
                path = $relative
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )

          $tipPath = 'C:\szl-bridge\logs\watchdog-receipt-tip.txt'
          $tip = if (Test-Path -LiteralPath $tipPath -PathType Leaf) {
            (Get-Content -LiteralPath $tipPath -Raw).Trim()
          } else { $null }
          if ($null -ne $tip -and $tip -notmatch '^[0-9a-f]{64}$') {
            throw 'Local watchdog receipt tip is malformed.'
          }

          $proof = [ordered]@{
            schema = 'szl.gpu-bridge-watchdog-owner-proof/v1'
            generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            source_revision = $env:GITHUB_SHA
            reconcile_exit_code = [int]'${{ steps.reconcile.outputs.exit_code }}'
            task_count = $tasks.Count
            tasks = $tasks
            installed_files = $files
            receipt_tip_sha256 = $tip
            principal_recorded = $false
            credential_values_recorded = $false
            private_addresses_recorded = $false
            remote_commands_accepted = $false
            inbound_ports_opened = $false
          }
          $destination = Join-Path $reportDirectory 'windows-watchdog-owner-proof.json'
          [IO.File]::WriteAllText(
            $destination,
            (($proof | ConvertTo-Json -Depth 12) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload immutable sanitized proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-watchdog-owner-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/windows-watchdog-owner-proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Require the installed liveness plane to be bounded and present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-Content 'reports\windows-watchdog-owner-proof.json' -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'szl.gpu-bridge-watchdog-owner-proof/v1') { throw 'wrong proof schema' }
          if ($proof.source_revision -ne $env:GITHUB_SHA) { throw 'source revision drift' }
          if ([int]$proof.task_count -ne 3) { throw 'the exact three-task closure is incomplete' }
          if (@($proof.tasks | Where-Object state -eq 'Disabled').Count -gt 0) { throw 'a watchdog task is disabled' }
          if ([int]$proof.reconcile_exit_code -ne 0) { throw 'the watchdog reconciliation engine failed' }
          if (@($proof.installed_files).Count -ne 4) { throw 'required owner files are incomplete' }
          foreach ($relative in @('daemon.ps1','watchdog.ps1','storage_preflight.py')) {
            $rows = @($proof.installed_files | Where-Object { $_.path -eq $relative })
            if ($rows.Count -ne 1) { throw "required owner source file missing: $relative" }
            $expected = Join-Path $env:GITHUB_WORKSPACE ('laptop\' + $relative)
            $installed = Join-Path 'C:\szl-bridge' $relative
            $current = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($rows[0].sha256 -cne $current) {
              throw "Installed owner proof changed since readback: $relative"
            }
            $parity = & "$env:GITHUB_WORKSPACE\laptop\source_parity.ps1" `
              -ExpectedSource $expected -InstalledSource $installed
            if ($parity -cne 'SOURCE_PARITY_VERIFIED') {
              throw "Installed owner proof source drift: $relative"
            }
          }
          if ($proof.principal_recorded -ne $false) { throw 'principal data leaked into proof' }
          if ($proof.credential_values_recorded -ne $false) { throw 'credential data leaked into proof' }
          if ($proof.private_addresses_recorded -ne $false) { throw 'private address leaked into proof' }
          if ($proof.remote_commands_accepted -ne $false) { throw 'remote command authority widened' }
          if ($proof.inbound_ports_opened -ne $false) { throw 'inbound port authority widened' }
 -or
              $env:SZL_REVIEWED_SOURCE_SHA -cne $env:GITHUB_SHA) {
            throw 'WATCHDOG_REVIEWED_SHA_MISMATCH'
          }
          if ([string]::IsNullOrWhiteSpace($env:SZL_APPROVED_RUNNER_NAME) -or
              $env:RUNNER_NAME -cne $env:SZL_APPROVED_RUNNER_NAME) {
            throw 'WATCHDOG_OWNER_RUNNER_UNVERIFIED'
          }
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind execution to an existing SZL bridge owner node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The runner service identity must be elevated.'
          }
          $task = Get-ScheduledTask -TaskName 'SZL-GPU-Bridge' -ErrorAction SilentlyContinue
          $daemon = Test-Path -LiteralPath 'C:\szl-bridge\daemon.ps1' -PathType Leaf
          if ($null -eq $task -or -not $daemon) {
            throw 'Existing owner prerequisites unavailable: both primary task and installed daemon are required.'
          }
          # Presence is not authorization: inspect one exact task action, before install.
          function Test-ReviewedPrimaryTaskAction {
            param($Task)
            if ($null -eq $Task -or @($Task).Count -ne 1) { return $false }
            if ($null -eq $Task.Actions -or @($Task.Actions).Count -ne 1) { return $false }
            if ([string]$Task.TaskPath -cne '\') { return $false }
            if ($null -eq $Task.Principal) { return $false }
            $account = [string]$Task.Principal.UserId
            if ([string]::IsNullOrWhiteSpace($account)) { return $false }
            if ($account -match '^(SYSTEM|NT AUTHORITY\\(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)|LOCAL SERVICE|NETWORK SERVICE)$') { return $false }
            if ([string]$Task.Principal.LogonType -notin @('Interactive','S4U')) { return $false }
            if ([string]::IsNullOrWhiteSpace([string]$env:SystemRoot)) { return $false }
            $expectedExe = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
            $expectedArgs = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File "C:\szl-bridge\daemon.ps1"'
            $action = @($Task.Actions)[0]
            if (-not [string]::Equals([string]$action.Execute, $expectedExe, [StringComparison]::OrdinalIgnoreCase)) { return $false }
            if (-not [string]::Equals([string]$action.Arguments, $expectedArgs, [StringComparison]::OrdinalIgnoreCase)) { return $false }
            if (-not [string]::IsNullOrWhiteSpace([string]$action.WorkingDirectory)) { return $false }
            return $true
          }
          if (-not (Test-ReviewedPrimaryTaskAction -Task $task)) {
            throw 'Existing primary task action is unverified or differs from reviewed installer.'
          }
          if ("$(git rev-parse HEAD)" -ne $env:GITHUB_SHA) {
            throw 'Checkout does not own the exact event revision.'
          }

      - name: Refuse stale owner daemon or absent storage preflight before mutations
