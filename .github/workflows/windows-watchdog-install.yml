name: Windows GPU bridge watchdog install

on:
  push:
    branches: [main]
    paths:
      - "laptop/watchdog.ps1"
      - "laptop/install_watchdog.ps1"
      - "laptop/daemon.ps1"
      - ".github/workflows/windows-watchdog-install.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-gpu-bridge-watchdog-install
  cancel-in-progress: false

jobs:
  install-and-prove:
    name: Install, reconcile, and prove bounded liveness
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Bind execution to an existing SZL bridge owner node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The runner service identity must be elevated.'
          }
          $task = Get-ScheduledTask -TaskName 'SZL-GPU-Bridge' -ErrorAction SilentlyContinue
          $daemon = Test-Path -LiteralPath 'C:\szl-bridge\daemon.ps1' -PathType Leaf
          if ($null -eq $task -and -not $daemon) {
            throw 'This machine is not bound to the existing SZL GPU bridge.'
          }
          if ("$(git rev-parse HEAD)" -ne $env:GITHUB_SHA) {
            throw 'Checkout does not own the exact event revision.'
          }

      - name: Install the exact local watchdog package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & .\laptop\install_watchdog.ps1 `
            -Root 'C:\szl-bridge' `
            -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'laptop') 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Watchdog installer failed with exit code $LASTEXITCODE."
          }
          # The installer output contains the local task principal. It is intentionally
          # held in memory only and is never printed or uploaded.
          if ([string]::IsNullOrWhiteSpace($output)) {
            throw 'Watchdog installer did not produce its local receipt.'
          }

      - name: Run one bounded reconciliation cycle
        id: reconcile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & 'C:\szl-bridge\watchdog.ps1' `
            -Mode Watchdog `
            -Root 'C:\szl-bridge' 2>&1 | Out-String
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($output)) {
            throw 'Watchdog did not produce a local cycle receipt.'
          }
          exit 0

      - name: Materialize a sanitized owner-node proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $reportDirectory = Join-Path $env:GITHUB_WORKSPACE 'reports'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null

          $taskNames = @(
            'SZL-GPU-Bridge',
            'SZL-GPU-Bridge-Watchdog',
            'SZL-GPU-Bridge-Guardian'
          )
          $tasks = @(
            foreach ($name in $taskNames) {
              $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
              $info = Get-ScheduledTaskInfo -TaskName $name
              [ordered]@{
                name = $name
                state = [string]$task.State
                last_task_result = [int64]$info.LastTaskResult
                last_run_time = if ($info.LastRunTime.Year -ge 2000) {
                  $info.LastRunTime.ToUniversalTime().ToString('o')
                } else { $null }
                next_run_time = if ($info.NextRunTime.Year -ge 2000) {
                  $info.NextRunTime.ToUniversalTime().ToString('o')
                } else { $null }
              }
            }
          )

          $files = @(
            foreach ($relative in @('daemon.ps1','watchdog.ps1','watchdog-config.json')) {
              $path = Join-Path 'C:\szl-bridge' $relative
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Required installed file is missing: $relative"
              }
              [ordered]@{
                path = $relative
                sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )

          $tipPath = 'C:\szl-bridge\logs\watchdog-receipt-tip.txt'
          $tip = if (Test-Path -LiteralPath $tipPath -PathType Leaf) {
            (Get-Content -LiteralPath $tipPath -Raw).Trim()
          } else { $null }
          if ($null -ne $tip -and $tip -notmatch '^[0-9a-f]{64}$') {
            throw 'Local watchdog receipt tip is malformed.'
          }

          $proof = [ordered]@{
            schema = 'szl.gpu-bridge-watchdog-owner-proof/v1'
            generated_at = [DateTimeOffset]::UtcNow.ToString('o')
            source_revision = $env:GITHUB_SHA
            reconcile_exit_code = [int]'${{ steps.reconcile.outputs.exit_code }}'
            task_count = $tasks.Count
            tasks = $tasks
            installed_files = $files
            receipt_tip_sha256 = $tip
            principal_recorded = $false
            credential_values_recorded = $false
            private_addresses_recorded = $false
            remote_commands_accepted = $false
            inbound_ports_opened = $false
          }
          $destination = Join-Path $reportDirectory 'windows-watchdog-owner-proof.json'
          [IO.File]::WriteAllText(
            $destination,
            (($proof | ConvertTo-Json -Depth 12) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload immutable sanitized proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-watchdog-owner-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/windows-watchdog-owner-proof.json
          if-no-files-found: error
          retention-days: 90

      - name: Require the installed liveness plane to be bounded and present
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-Content 'reports\windows-watchdog-owner-proof.json' -Raw | ConvertFrom-Json
          if ($proof.schema -ne 'szl.gpu-bridge-watchdog-owner-proof/v1') { throw 'wrong proof schema' }
          if ($proof.source_revision -ne $env:GITHUB_SHA) { throw 'source revision drift' }
          if ([int]$proof.task_count -ne 3) { throw 'the exact three-task closure is incomplete' }
          if (@($proof.tasks | Where-Object state -eq 'Disabled').Count -gt 0) { throw 'a watchdog task is disabled' }
          if ([int]$proof.reconcile_exit_code -ne 0) { throw 'the watchdog reconciliation engine failed' }
          if ($proof.principal_recorded -ne $false) { throw 'principal data leaked into proof' }
          if ($proof.credential_values_recorded -ne $false) { throw 'credential data leaked into proof' }
          if ($proof.private_addresses_recorded -ne $false) { throw 'private address leaked into proof' }
          if ($proof.remote_commands_accepted -ne $false) { throw 'remote command authority widened' }
          if ($proof.inbound_ports_opened -ne $false) { throw 'inbound port authority widened' }
