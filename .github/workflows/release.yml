name: Publish szl to PyPI

# Register the trusted publisher on PyPI with owner szl-holdings,
# repository szl-gpu-bridge, workflow release.yml, environment release.
# A branch dispatch only validates. Publication requires the exact version tag.

on:
  workflow_dispatch: {}
  push:
    tags: ["szl-v*"]

permissions:
  contents: read

concurrency:
  group: szl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact release tag from main history
        run: bash sdk/tools/check_release_ref.sh "$GITHUB_REF"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build and verify the exact release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m build sdk --outdir "$RUNNER_TEMP/sdk-dist"
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args=(--tag "$GITHUB_REF_NAME")
          fi
          python sdk/tools/verify_release.py --dist "$RUNNER_TEMP/sdk-dist" "${args[@]}"
          python -m twine check --strict "$RUNNER_TEMP"/sdk-dist/*
      - name: Run all SDK tests against the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/sdk-dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/sdk/tests" -v
      - name: Rebuild and test the source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/sdk-source"
          tar -xzf "$RUNNER_TEMP"/sdk-dist/*.tar.gz -C "$RUNNER_TEMP/sdk-source"
          python -m build --wheel "$RUNNER_TEMP"/sdk-source/szl-* --outdir "$RUNNER_TEMP/sdk-rebuilt"
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/sdk-rebuilt/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/sdk/tests" -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: szl-dist
          path: ${{ runner.temp }}/sdk-dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/szl-v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: szl-dist
          path: dist
      - name: Publish the tested artifacts using trusted publishing with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
