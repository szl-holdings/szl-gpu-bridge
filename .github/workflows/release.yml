name: Publish szl to PyPI

# Trusted Publishing: no API token, no secret. PyPI verifies this workflow's
# GitHub OIDC identity against the publisher registered at
# https://pypi.org/manage/account/publishing/ (owner: szl-holdings,
# repository: szl-gpu-bridge, workflow: release.yml, environment: release,
# project name: szl).
#
# ONE-TIME OWNER ACTION (Stephen, ~60 seconds in the PyPI UI):
#   pypi.org -> account settings -> Publishing -> add publisher:
#     PyPI project: szl  |  owner: szl-holdings  |  repo: szl-gpu-bridge
#     workflow: release.yml  |  environment: release
# After that, this workflow (or a manual dispatch) publishes token-free.

on:
  workflow_dispatch: {}
  push:
    tags: ["szl-v*"]

permissions:
  id-token: write  # OIDC for trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          cd sdk && python -m build
      - name: Test the built wheel (no network)
        run: |
          pip install dist/szl-*.whl 2>/dev/null || pip install sdk/dist/szl-*.whl
          python -c "from szl import kamachikuna; assert kamachikuna.gate('x', True)[1] == 'ALLOWED'; print('wheel OK')"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish to PyPI (trusted publishing — no token, uv OIDC)
        run: |
          ls -la sdk/dist/ || true
          ls -la dist/ || true
          uv publish sdk/dist
