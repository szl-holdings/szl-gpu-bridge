name: Auto-merge safe dependencies

# Tier 0 of the autonomy ladder (docs/AUTONOMY_LADDER.md): lockfile-only
# dependency bumps from Dependabot with ALL checks green are reversible,
# receipted work — they automate. Everything else (feature PRs, policy
# changes, anything touching source) stays human-gated at the 0.3%.
#
# Safe to automate ONLY when ALL of:
#   - author is dependabot[bot]
#   - changed paths are lockfile/manifest only (no source)
#   - every check is green (no pending, no failing, no skipping-required)
# Anything else: skip silently — the Release Manager digest surfaces it.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write        # required to merge the qualified PR (the lane's purpose)
  pull-requests: write  # required to leave the receipt comment on every merge/skip

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || (github.event_name == 'check_suite' && true) }}
    steps:
      - name: Evaluate and merge only lockfile-only, all-green Dependabot PRs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1, verified immutable
        with:
          script: |
            const pr_number = context.payload.pull_request?.number
              ?? (context.payload.check_suite?.pull_requests?.[0]?.number);
            if (!pr_number) { console.log("no PR associated — skip"); return; }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr_number,
            });
            if (pr.user.login !== "dependabot[bot]") {
              console.log(`author ${pr.user.login} is not dependabot — skip (human gate)`);
              return;
            }
            if (pr.state !== "open" || pr.draft) { console.log("not open/non-draft — skip"); return; }

            // lockfile-only: every changed file must match these patterns
            const SAFE = [/\brequirements\/.*\.txt$/, /\brequirements.*\.in$/, /package-lock\.json$/, /\bpoetry\.lock$/, /\buv\.lock$/, /Cargo\.lock$/, /go\.(sum|mod)$/];
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr_number, per_page: 100,
            });
            const unsafe = files.filter(f => !SAFE.some(rx => rx.test(f.filename)));
            if (unsafe.length) {
              console.log(`non-lockfile changes: ${unsafe.map(f => f.filename).join(", ")} — skip (human gate)`);
              return;
            }

            // all checks green: no pending, no failing
            const { data: checks } = await github.rest.checkSuites.listForRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: pr.head.sha, per_page: 100,
            });
            const suites = checks.check_suites.filter(s => s.app?.slug !== "github-pages");
            if (!suites.length) { console.log("no check suites yet — wait"); return; }
            const bad = suites.filter(s => s.conclusion !== "success");
            if (bad.length) {
              console.log(`checks not all green (${bad.map(s => s.conclusion).join(",")}) — skip`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr_number, merge_method: "merge",
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr_number,
              body: "Auto-merged by the Tier-0 lane: dependabot + lockfile-only + all checks green. " +
                    "Reversible, receipted work per docs/AUTONOMY_LADDER.md — the 0.3% stays human for everything else.",
            });
            console.log(`MERGED #${pr_number} (Tier-0 auto-merge)`);
