name: Format governed Nemo v3 PR files

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/format-nemo-v3-pr.yml

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/nemo-v3-governed-job-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Format and lint-fix only the new governed path
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.15.22'
          ruff format \
            laptop/dispatcher.py \
            laptop/nemo_v3_contract.py \
            laptop/runjob_nemo_v3.py \
            tests/test_nemo_v3_contract.py
          ruff check --fix \
            laptop/dispatcher.py \
            laptop/nemo_v3_contract.py \
            laptop/runjob_nemo_v3.py \
            tests/test_nemo_v3_contract.py
          rm .github/workflows/format-nemo-v3-pr.yml
      - name: Commit formatted files and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit \
            -m 'style(nemo-v3): apply deterministic Ruff formatting' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
