name: Fleet watch

# Bounded owner-scoped Salad metadata + independent global receipt-chain read.
# A running container-group status is NOT trainer-step, GPU, checkpoint or
# billing proof. The collector never calls a provider write endpoint.
# Requires the existing SALAD_API_KEY secret; never prints its value.

on:
  schedule:
    - cron: "23 * * * *" # hourly at :23
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe bounded provider groups and global receipt recency
        id: fleet
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: python3 -I -B tools/salad/fleet_watch_readonly.py

      - name: File or update the fleet-drift issue (never silent)
        if: ${{ steps.fleet.outputs.has_drift == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FLEET_DRIFT_JSON: ${{ steps.fleet.outputs.drift }}
          FLEET_REPORT_JSON: ${{ steps.fleet.outputs.report }}
        with:
          script: |
            const title = "Fleet watch: drift detected";
            // Untrusted provider strings are data, never JavaScript source.
            const drift = JSON.parse(process.env.FLEET_DRIFT_JSON || "[]");
            const report = JSON.parse(process.env.FLEET_REPORT_JSON || "{}");
            const body = [
              "## Fleet watch report",
              "",
              "```json",
              JSON.stringify({drift, report}, null, 2),
              "```",
              "",
              "RELEASE/TRAINING ADMISSION: HOLD until each lane has independently",
              "source-bound trainer, checkpoint and authorized runtime readback.",
              "A global receipt-chain commit is not a particular lane heartbeat.",
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "fleet-drift",
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["fleet-drift", "automated"],
              });
            }
