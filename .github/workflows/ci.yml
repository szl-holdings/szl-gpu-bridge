name: GPU bridge contract CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gpu-bridge-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile container-runtime Python
        run: python -m py_compile laptop/*.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: >-
          python -m pip install
          "PyNaCl==1.6.2"
          "cryptography==48.0.0"
          "jsonschema==4.26.0"
          "ruff==0.15.22"
      - name: Compile Python
        run: python -m py_compile laptop/*.py tests/*.py
      - name: Verify deterministic Python formatting
        run: ruff format --check laptop tests
      - name: Lint Python
        run: ruff check laptop tests
      - name: Validate Node entrypoints
        run: |
          node --check cloud/sign-job.mjs
          node --check cloud/sign-nemo-v3-job.mjs
          node --check cloud/verify-receipt.mjs
          node --check cloud/materialize-frontier-spec.mjs
      - name: Run fail-closed contract tests
        run: |
          python -m unittest discover -s tests -v
          node --test \
            tests/test_cloud_contract.mjs \
            tests/test_cloud_nemo_v3.mjs \
            tests/test_materialize_frontier_spec.mjs
      - name: Validate JSON schemas and queued specs
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema.validators import Draft202012Validator

          for path in pathlib.Path('schema').glob('*.json'):
              schema = json.loads(path.read_text(encoding='utf-8-sig'))
              Draft202012Validator.check_schema(schema)
              print('valid draft-2020-12 schema:', path)
          nemo_schema = json.loads(
              pathlib.Path('schema/nemo-v3-jobspec.v1.json').read_text(
                  encoding='utf-8-sig'
              )
          )
          nemo_validator = Draft202012Validator(
              nemo_schema,
              format_checker=Draft202012Validator.FORMAT_CHECKER,
          )
          for path in pathlib.Path('jobspecs').glob('nemo-v3-*.json'):
              nemo_validator.validate(
                  json.loads(path.read_text(encoding='utf-8-sig'))
              )
              print('valid Nemo v3 jobspec:', path)
          for path in pathlib.Path('queue').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8-sig'))
              print('valid queued json:', path)
          PY

  windows-watchdog-contract:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact change revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse watchdog and installer without executing mutations
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
            'laptop\watchdog.ps1',
            'laptop\install_watchdog.ps1',
            'laptop\daemon.ps1'
          )) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
            }
          }

      - name: Require bounded local authority and redundant liveness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $watchdog = Get-Content 'laptop\watchdog.ps1' -Raw
          $installer = Get-Content 'laptop\install_watchdog.ps1' -Raw
          $combined = $watchdog + "`n" + $installer

          foreach ($required in @(
            'SZL-GPU-Bridge',
            'SZL-GPU-Bridge-Watchdog',
            'SZL-GPU-Bridge-Guardian',
            'Global\SZLGpuBridgeWatchdog',
            'New-TimeSpan -Minutes 5',
            'New-TimeSpan -Minutes 15',
            'New-TimeSpan -Hours 26',
            '-MultipleInstances IgnoreNew',
            '-LogonType S4U',
            'rolling start budget exhausted',
            'watchdog-receipt-tip.txt',
            'szl.gpu-bridge-watchdog-receipt/v1',
            'credential_values_read = $false',
            'remote_commands_accepted = $false',
            'inbound_ports_opened = $false'
          )) {
            if (-not $combined.Contains($required)) {
              throw "missing contract marker: $required"
            }
          }

          foreach ($forbidden in @(
            'Invoke-Expression',
            'DownloadString(',
            'FromBase64String',
            '-EncodedCommand',
            'cmd.exe /c',
            'Invoke-WebRequest',
            'Invoke-RestMethod',
            'Start-BitsTransfer'
          )) {
            if ($combined.Contains($forbidden)) {
              throw "forbidden execution primitive present: $forbidden"
            }
          }
