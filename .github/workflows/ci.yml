name: GPU bridge contract CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gpu-bridge-contract-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Compile container-runtime Python
        run: python -m py_compile laptop/*.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verifier dependencies
        run: python -m pip install "PyNaCl==1.6.2" "jsonschema==4.26.0" "ruff==0.15.22"
      - name: Compile Python
        run: python -m py_compile laptop/*.py tests/*.py
      - name: Verify deterministic Python formatting
        run: ruff format --check laptop tests
      - name: Lint Python
        run: ruff check laptop tests
      - name: Validate Node entrypoints
        run: |
          node --check cloud/sign-job.mjs
          node --check cloud/sign-nemo-v3-job.mjs
          node --check cloud/verify-receipt.mjs
          node --check cloud/materialize-frontier-spec.mjs
      - name: Run fail-closed contract tests
        run: |
          python -m unittest discover -s tests -v
          node --test \
            tests/test_cloud_contract.mjs \
            tests/test_cloud_nemo_v3.mjs \
            tests/test_materialize_frontier_spec.mjs
      - name: Validate JSON schemas and queued specs
        run: |
          python - <<'PY'
          import json
          import pathlib
          from jsonschema.validators import Draft202012Validator

          for path in pathlib.Path('schema').glob('*.json'):
              schema = json.loads(path.read_text(encoding='utf-8-sig'))
              Draft202012Validator.check_schema(schema)
              print('valid draft-2020-12 schema:', path)
          for path in pathlib.Path('queue').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8-sig'))
              print('valid queued json:', path)
          PY
