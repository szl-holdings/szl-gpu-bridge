    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nemo-v3-governed-attempt-status
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
  GH_TOKEN: ${{ github.token }}
  SZL_LAPTOP_RECEIPT_KEY_ID: ${{ vars.SZL_LAPTOP_RECEIPT_KEY_ID }}

jobs:
  status:
    name: Verify reviewed spec, signed queue, and terminal receipt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - attempt_id: predecessor
            spec_path: jobspecs/nemo-v3-20260722-reviewed.json
            report_path: reports/nemo-v3-attempt-status.json
            report_title: '[nemo-v3-attempt] governed single attempt'
            report_marker: szl-nemo-v3-governed-attempt
            report_heading: SZL-Nemo v3 governed single attempt
          - attempt_id: successor-2
            spec_path: jobspecs/nemo-v3-20260729-successor-2-reviewed.json
            report_path: reports/nemo-v3-successor-2-status.json
            report_title: '[nemo-v3-successor-2] governed successor generation'
            report_marker: szl-nemo-v3-governed-successor-2
            report_heading: SZL-Nemo v3 governed successor generation 2
          - attempt_id: successor-3-key-recovery
            spec_path: jobspecs/nemo-v3-20260730-successor-3-reviewed.json
            report_path: reports/nemo-v3-successor-3-status.json
            report_title: '[nemo-v3-successor-3] governed key-recovery generation'
            report_marker: szl-nemo-v3-governed-successor-3
            report_heading: SZL-Nemo v3 governed successor generation 3 key recovery
          - attempt_id: attempt-2-b21
            spec_path: jobspecs/nemo-v3-20260729-attempt-2-reviewed.json
            report_path: reports/nemo-v3-attempt-2-b21-status.json
            report_title: '[nemo-v3-attempt-2-b21] governed owner-dispatch attempt'
            report_marker: szl-nemo-v3-governed-attempt-2-b21
            report_heading: SZL-Nemo v3 governed attempt 2 for A11oy b21b8fb65400
          - attempt_id: attempt-4-coordinated-recovery
            spec_path: jobspecs/nemo-v3-20260730-attempt-4-reviewed.json
            report_path: reports/nemo-v3-attempt-4-status.json
            report_title: '[nemo-v3-attempt-4] governed coordinated recovery'
            report_marker: szl-nemo-v3-governed-attempt-4
            report_heading: SZL-Nemo v3 governed attempt 4 coordinated recovery
          - attempt_id: attempt-5-transport-v3-recovery
            spec_path: jobspecs/nemo-v3-20260730-attempt-5-reviewed.json
            report_path: reports/nemo-v3-attempt-5-status.json
            report_title: '[nemo-v3-attempt-5] governed transport-v3 recovery'
            report_marker: szl-nemo-v3-governed-attempt-5
            report_heading: SZL-Nemo v3 governed attempt 5 transport-v3 recovery
          - attempt_id: attempt-6-host-policy-recovery
            spec_path: jobspecs/nemo-v3-20260730-attempt-6-reviewed.json
            report_path: reports/nemo-v3-attempt-6-status.json
            report_title: '[nemo-v3-attempt-6] governed host-policy recovery'
            report_marker: szl-nemo-v3-governed-attempt-6
            report_heading: SZL-Nemo v3 governed attempt 6 host-policy recovery
          - attempt_id: attempt-7-validator-lineage-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-7-reviewed.json
            report_path: reports/nemo-v3-attempt-7-status.json
            report_title: '[nemo-v3-attempt-7] governed validator-lineage recovery'
            report_marker: szl-nemo-v3-governed-attempt-7
            report_heading: SZL-Nemo v3 governed attempt 7 validator-lineage recovery
          - attempt_id: attempt-8-runtime-binding-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-8-reviewed.json
            report_path: reports/nemo-v3-attempt-8-status.json
            report_title: '[nemo-v3-attempt-8] governed runtime-binding recovery'
            report_marker: szl-nemo-v3-governed-attempt-8
            report_heading: SZL-Nemo v3 governed attempt 8 runtime-binding recovery
          - attempt_id: attempt-9-prefetch-checkout-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-9-reviewed.json
            report_path: reports/nemo-v3-attempt-9-status.json
            report_title: '[nemo-v3-attempt-9] governed prefetch-checkout recovery'
            report_marker: szl-nemo-v3-governed-attempt-9
            report_heading: SZL-Nemo v3 governed attempt 9 prefetch-checkout recovery
          - attempt_id: attempt-10-cache-license-finalizer-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-10-reviewed.json
            report_path: reports/nemo-v3-attempt-10-status.json
            report_title: '[nemo-v3-attempt-10] governed cache/license/finalizer recovery'
            report_marker: szl-nemo-v3-governed-attempt-10
            report_heading: SZL-Nemo v3 governed attempt 10 cache/license/finalizer recovery
          - attempt_id: attempt-11-runtime-admission-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-11-reviewed.json
            report_path: reports/nemo-v3-attempt-11-status.json
            report_title: '[nemo-v3-attempt-11] governed runtime-admission recovery'
            report_marker: szl-nemo-v3-governed-attempt-11
            report_heading: SZL-Nemo v3 governed attempt 11 runtime-admission recovery
          - attempt_id: attempt-12-tokenizer-load-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-12-reviewed.json
            report_path: reports/nemo-v3-attempt-12-status.json
            report_title: '[nemo-v3-attempt-12] governed tokenizer-load recovery'
            report_marker: szl-nemo-v3-governed-attempt-12
            report_heading: SZL-Nemo v3 governed attempt 12 tokenizer-load recovery
          - attempt_id: attempt-13-runtime-binding-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-13-reviewed.json
            report_path: reports/nemo-v3-attempt-13-status.json
            report_title: '[nemo-v3-attempt-13] governed runtime-binding recovery'
            report_marker: szl-nemo-v3-governed-attempt-13
            report_heading: SZL-Nemo v3 governed attempt 13 runtime-binding recovery
          - attempt_id: attempt-14-sftconfig-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-14-reviewed.json
            report_path: reports/nemo-v3-attempt-14-status.json
            report_title: '[nemo-v3-attempt-14] governed SFTConfig recovery'
            report_marker: szl-nemo-v3-governed-attempt-14
            report_heading: SZL-Nemo v3 governed attempt 14 SFTConfig recovery
          - attempt_id: attempt-15-meta-tensor-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-15-reviewed.json
            report_path: reports/nemo-v3-attempt-15-status.json
            report_title: '[nemo-v3-attempt-15] governed meta-tensor recovery'
            report_marker: szl-nemo-v3-governed-attempt-15
            report_heading: SZL-Nemo v3 governed attempt 15 meta-tensor recovery
          - attempt_id: attempt-16-runtime-binding-recovery
            spec_path: jobspecs/nemo-v3-20260731-attempt-16-reviewed.json
            report_path: reports/nemo-v3-attempt-16-status.json
            report_title: '[nemo-v3-attempt-16] governed runtime-binding recovery'
            report_marker: szl-nemo-v3-governed-attempt-16
            report_heading: SZL-Nemo v3 governed attempt 16 runtime-binding recovery
          - attempt_id: attempt-17-settled-runtime-successor
            spec_path: jobspecs/nemo-v3-20260801-attempt-17-reviewed.json
            report_path: reports/nemo-v3-attempt-17-status.json
            report_title: '[nemo-v3-attempt-17] governed settled-runtime successor'
            report_marker: szl-nemo-v3-governed-attempt-17
            report_heading: SZL-Nemo v3 governed attempt 17 settled-runtime successor
    env:
      SPEC_PATH: ${{ matrix.spec_path }}
      REPORT_PATH: ${{ matrix.report_path }}
      REPORT_TITLE: ${{ matrix.report_title }}
      REPORT_MARKER: ${{ matrix.report_marker }}
      REPORT_HEADING: ${{ matrix.report_heading }}
    steps:
      - name: Checkout the exact protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install verification-only dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'PyNaCl==1.6.2' \
            'huggingface_hub==1.19.0'

      - name: Compile and run fail-closed contract tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m py_compile \
            cloud/nemo_v3_status.py \
            laptop/frontier_contract.py \
            laptop/nemo_v3_contract.py \
            tests/test_reviewed_nemo_v3_spec.py \
            tests/test_reviewed_nemo_v3_successor_spec.py \
            tests/test_reviewed_nemo_v3_successor_3_spec.py \
            tests/test_reviewed_nemo_v3_attempt_2_spec.py \
            tests/test_reviewed_nemo_v3_attempt_4_spec.py \
            tests/test_reviewed_nemo_v3_attempt_5_spec.py \
            tests/test_reviewed_nemo_v3_attempt_6_spec.py \
            tests/test_reviewed_nemo_v3_attempt_7_spec.py \
            tests/test_reviewed_nemo_v3_attempt_8_spec.py \
            tests/test_reviewed_nemo_v3_attempt_9_spec.py \
            tests/test_reviewed_nemo_v3_attempt_10_spec.py \
            tests/test_reviewed_nemo_v3_attempt_11_spec.py \
            tests/test_reviewed_nemo_v3_attempt_12_spec.py \
            tests/test_reviewed_nemo_v3_attempt_13_spec.py \
            tests/test_reviewed_nemo_v3_attempt_14_spec.py \
            tests/test_reviewed_nemo_v3_attempt_15_spec.py \
            tests/test_reviewed_nemo_v3_attempt_16_spec.py \
            tests/test_reviewed_nemo_v3_attempt_17_spec.py \
            tests/test_nemo_v3_conversation_labels.py \
            tests/test_nemo_v3_meta_tensor_compat.py \
            tests/test_nemo_v3_sftconfig_compat.py \
            tests/test_engine_keyring.py \
            tests/test_isolated_nemo_launcher_contract.py \
            tests/test_nemo_v3_dispatcher_engine_key_scope.py \
            tests/test_nemo_v3_status.py
          python -m unittest discover -s tests -p 'test_*nemo_v3*.py' -v
          node --check cloud/sign-nemo-v3-job.mjs
          node --check cloud/verify-receipt.mjs
          git diff --check

      - name: Evaluate current signed evidence
        id: evaluate
        shell: bash
        run: |
          set +e
          python cloud/nemo_v3_status.py \
            --spec "$SPEC_PATH" \
            --report "$REPORT_PATH"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable status evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemo-v3-${{ matrix.attempt_id }}-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Persist deterministic attempt status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REPORT_PATH"
          status="$(python -c 'import json,os; print(json.load(open(os.environ["REPORT_PATH"]))["status"])')"
          terminal="$(python -c 'import json,os; print(str(json.load(open(os.environ["REPORT_PATH"]))["terminal"]).lower())')"
          {
            echo "<!-- ${REPORT_MARKER} -->"
            echo "# ${REPORT_HEADING}"
            echo
            echo "- Status: **${status}**"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Reviewed spec: \`${SPEC_PATH}\`"
            echo '- Queue authorization: pinned engine DSSE only'
            echo '- Receipt authorization: enrolled owner-laptop keyId only'
            echo
            echo '```json'
            cat "$REPORT_PATH"
            echo '```'
          } > /tmp/nemo-v3-status.md
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "${REPORT_TITLE} in:title" --json number,title \
            --jq ".[] | select(.title == env.REPORT_TITLE) | .number" | head -n1)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/nemo-v3-status.md
          else
            issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$REPORT_TITLE" --body-file /tmp/nemo-v3-status.md)"
            issue="${issue_url##*/}"
          fi
          if [ "$terminal" = 'true' ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "The single governed attempt reached terminal state ${status}. This is not a release or deployment claim." || true
          else
            gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Enforce evidence integrity
        if: always()
        env:
          EXIT_CODE: ${{ steps.evaluate.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Nemo v3 signed evidence is invalid or unreadable; inspect the immutable report."
            exit "$code"
          fi
          echo 'Nemo v3 status controller completed without converting missing evidence into success.'
