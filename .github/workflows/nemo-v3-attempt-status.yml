name: Nemo v3 Governed Attempt Status

on:
  push:
    branches: [main]
    paths:
      - jobspecs/nemo-v3-20260722-reviewed.json
      - queue/pending/job-2026-nemo-v3-governed-attempt-1.json
      - cloud/nemo_v3_status.py
      - cloud/sign-nemo-v3-job.mjs
      - cloud/verify-receipt.mjs
      - laptop/nemo_v3_contract.py
      - laptop/runjob_nemo_v3.py
      - tests/test_reviewed_nemo_v3_spec.py
      - tests/test_nemo_v3_status.py
      - docs/NEMO_V3_EXECUTION.md
      - .github/workflows/nemo-v3-attempt-status.yml
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nemo-v3-governed-attempt-status
  cancel-in-progress: true

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HF_ORG_TOKEN || secrets.HF_ORG_TOKEN1 }}
  GH_TOKEN: ${{ github.token }}
  SZL_LAPTOP_RECEIPT_KEY_ID: ${{ vars.SZL_LAPTOP_RECEIPT_KEY_ID }}
  REPORT_PATH: reports/nemo-v3-attempt-status.json
  REPORT_TITLE: '[nemo-v3-attempt] governed single attempt'

jobs:
  status:
    name: Verify reviewed spec, signed queue, and terminal receipt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install verification-only dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'PyNaCl==1.6.2' \
            'huggingface_hub==1.19.0'

      - name: Compile and run fail-closed contract tests
        run: |
          set -euo pipefail
          python -m py_compile \
            cloud/nemo_v3_status.py \
            laptop/frontier_contract.py \
            laptop/nemo_v3_contract.py \
            tests/test_reviewed_nemo_v3_spec.py \
            tests/test_nemo_v3_status.py
          python -m unittest discover -s tests -p 'test_*nemo_v3*.py' -v
          node --check cloud/sign-nemo-v3-job.mjs
          node --check cloud/verify-receipt.mjs
          git diff --check

      - name: Evaluate current signed evidence
        id: evaluate
        shell: bash
        run: |
          set +e
          python cloud/nemo_v3_status.py --report "$REPORT_PATH"
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable status evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemo-v3-governed-attempt-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Persist deterministic attempt status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REPORT_PATH"
          status="$(python -c 'import json,os; print(json.load(open(os.environ["REPORT_PATH"]))["status"])')"
          terminal="$(python -c 'import json,os; print(str(json.load(open(os.environ["REPORT_PATH"]))["terminal"]).lower())')"
          {
            echo '<!-- szl-nemo-v3-governed-attempt -->'
            echo '# SZL-Nemo v3 governed single attempt'
            echo
            echo "- Status: **${status}**"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '- Reviewed spec: `jobspecs/nemo-v3-20260722-reviewed.json`'
            echo '- Queue authorization: pinned engine DSSE only'
            echo '- Receipt authorization: enrolled owner-laptop keyId only'
            echo
            echo '```json'
            cat "$REPORT_PATH"
            echo '```'
          } > /tmp/nemo-v3-status.md
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "${REPORT_TITLE} in:title" --json number,title \
            --jq ".[] | select(.title == env.REPORT_TITLE) | .number" | head -n1)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/nemo-v3-status.md
          else
            issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$REPORT_TITLE" --body-file /tmp/nemo-v3-status.md)"
            issue="${issue_url##*/}"
          fi
          if [ "$terminal" = 'true' ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason completed \
              --comment "The single governed attempt reached terminal state ${status}. This is not a release or deployment claim." || true
          else
            gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Enforce evidence integrity
        if: always()
        env:
          EXIT_CODE: ${{ steps.evaluate.outputs.exit_code }}
        run: |
          code="${EXIT_CODE:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Nemo v3 signed evidence is invalid or unreadable; inspect the immutable report."
            exit "$code"
          fi
          echo 'Nemo v3 status controller completed without converting missing evidence into success.'
