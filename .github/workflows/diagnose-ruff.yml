name: Repair exact frontier Ruff finding

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ruff.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'frontier/training-contract-v2' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frontier/training-contract-v2
          fetch-depth: 0

      - name: Detect whether repair is already complete
        id: precheck
        shell: bash
        run: |
          if grep -Fq '"".join(l for l in pem.splitlines() if "-----" not in l)' laptop/runjob.py || [[ -f diagnostics/ruff.json ]]; then
            echo 'repair=true' >> "$GITHUB_OUTPUT"
          else
            echo 'repair=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precheck.outputs.repair == 'true'
        with:
          python-version: '3.12'

      - name: Apply exact repair and verify complete contract
        if: steps.precheck.outputs.repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('laptop/runjob.py')
          text = path.read_text()
          old = '"".join(l for l in pem.splitlines() if "-----" not in l)'
          new = '"".join(line for line in pem.splitlines() if "-----" not in line)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one ambiguous variable occurrence, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm -f diagnostics/ruff.json
          python -m pip install 'PyNaCl==1.6.2' 'jsonschema==4.26.0' 'ruff==0.15.22'
          ruff format laptop tests
          ruff format --check laptop tests
          ruff check laptop tests
          python -m py_compile laptop/*.py tests/*.py
          python -m unittest discover -s tests -v
          node --check cloud/sign-job.mjs
          node --check cloud/verify-receipt.mjs
          node --check cloud/materialize-frontier-spec.mjs
          node --test tests/test_cloud_contract.mjs tests/test_materialize_frontier_spec.mjs

      - name: Commit verified repair
        if: steps.precheck.outputs.repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laptop/runjob.py diagnostics/ruff.json
          git commit -m 'fix(frontier): clear exact Ruff lint finding' -m 'Rename one ambiguous local variable in the legacy v1 runner.' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:frontier/training-contract-v2
