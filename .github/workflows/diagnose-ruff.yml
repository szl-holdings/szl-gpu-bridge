name: Capture frontier Ruff diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ruff.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'frontier/training-contract-v2' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frontier/training-contract-v2
          fetch-depth: 0

      - name: Skip when diagnostics already exist
        id: precheck
        shell: bash
        run: |
          if [[ -f diagnostics/ruff.json ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.precheck.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Persist exact Ruff findings
        if: steps.precheck.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.15.22'
          mkdir -p diagnostics
          ruff check laptop tests --output-format json > diagnostics/ruff.json || true
          test -s diagnostics/ruff.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/ruff.json
          git commit -m 'docs(ci): record exact frontier Ruff diagnostics' -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:frontier/training-contract-v2
