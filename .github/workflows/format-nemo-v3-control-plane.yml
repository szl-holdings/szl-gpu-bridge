name: Format Nemo v3 control plane

on:
  push:
    branches: [feat/nemo-v3-reviewed-execution-spec]
    paths:
      - .github/workflows/format-nemo-v3-control-plane.yml

permissions:
  contents: write

concurrency:
  group: format-nemo-v3-control-plane
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/nemo-v3-reviewed-execution-spec
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply the repository's exact formatter and linter
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.15.22'
          ruff format tests/test_reviewed_nemo_v3_spec.py tests/test_nemo_v3_status.py
          ruff check --fix tests/test_reviewed_nemo_v3_spec.py tests/test_nemo_v3_status.py
          ruff format --check tests/test_reviewed_nemo_v3_spec.py tests/test_nemo_v3_status.py
          ruff check tests/test_reviewed_nemo_v3_spec.py tests/test_nemo_v3_status.py
          rm .github/workflows/format-nemo-v3-control-plane.yml
          git diff --check
      - name: Commit only the formatted product files and self-remove
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_reviewed_nemo_v3_spec.py \
            tests/test_nemo_v3_status.py \
            .github/workflows/format-nemo-v3-control-plane.yml
          git diff --cached --check
          git commit \
            -m 'style(nemo-v3): apply repository formatter' \
            -m 'Run the exact pinned Ruff formatter/linter and remove the one-shot formatter workflow from the resulting branch.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:feat/nemo-v3-reviewed-execution-spec
